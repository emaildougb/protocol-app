<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Clark County EMS — Protocol Quick Reference</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --navy:#0f172a;--red:#b91c1c;--red-lt:#fef2f2;--blue:#1e3a8a;--blue-lt:#eff6ff;
  --green:#166534;--green-lt:#f0fdf4;--amber:#92400e;--amber-lt:#fffbeb;
  --slate:#f1f5f9;--border:#e2e8f0;--text:#0f172a;--muted:#64748b;--white:#fff;
  --mono:'Courier New',monospace;
}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,sans-serif;background:var(--slate);color:var(--text);min-height:100vh;font-size:15px}
.hdr{position:fixed;top:0;left:0;right:0;background:var(--navy);z-index:100;padding:12px 14px 0}
.hdr-top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.hdr-title{color:#fff;font-size:15px;font-weight:800;letter-spacing:0.5px;text-transform:uppercase;flex:1;line-height:1.2}
.hdr-sub{color:#94a3b8;font-size:10px;font-weight:600;letter-spacing:1px;text-transform:uppercase}
.count-badge{background:rgba(255,255,255,0.12);color:#94a3b8;font-size:11px;font-weight:600;padding:3px 8px;border-radius:10px;white-space:nowrap;flex-shrink:0}
.search-wrap{position:relative;margin-bottom:10px}
.search-wrap input{width:100%;padding:10px 36px 10px 12px;border-radius:8px;border:none;background:rgba(255,255,255,0.12);color:#fff;font-size:15px;outline:none;-webkit-appearance:none}
.search-wrap input::placeholder{color:#94a3b8}
.search-wrap input:focus{background:rgba(255,255,255,0.18)}
.search-clear{position:absolute;right:10px;top:50%;transform:translateY(-50%);color:#94a3b8;font-size:20px;cursor:pointer;background:none;border:none;display:none;line-height:1;padding:4px}
.cats{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none;-ms-overflow-style:none}
.cats::-webkit-scrollbar{display:none}
.cat-btn{flex-shrink:0;padding:5px 12px;border-radius:20px;border:1px solid rgba(255,255,255,0.18);background:transparent;color:#94a3b8;font-size:12px;font-weight:600;cursor:pointer;letter-spacing:0.3px;transition:all 0.15s}
.cat-btn.active{background:var(--red);border-color:var(--red);color:#fff}
.content{padding-top:162px;padding-bottom:24px}
.protocol-card{margin:0 12px 10px;border-radius:10px;background:#fff;border:1px solid var(--border);overflow:hidden;transition:border-color 0.15s}
.protocol-card.expanded{border-color:var(--navy);box-shadow:0 2px 12px rgba(15,23,42,0.12)}
.card-head{display:flex;align-items:center;gap:10px;padding:14px;cursor:pointer;user-select:none}
.card-name{font-size:15px;font-weight:700;color:var(--text);line-height:1.3}
.card-cat{font-size:10px;color:var(--muted);font-weight:700;letter-spacing:0.8px;text-transform:uppercase;margin-top:3px}
.card-chevron{color:var(--muted);font-size:22px;transition:transform 0.2s;line-height:1;margin-left:auto;flex-shrink:0}
.protocol-card.expanded .card-chevron{transform:rotate(180deg)}
.card-tabs{display:flex;border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none}
.card-tabs::-webkit-scrollbar{display:none}
.tab-btn{flex-shrink:0;padding:10px 14px;font-size:11px;font-weight:700;color:var(--muted);border:none;border-bottom:2px solid transparent;background:transparent;cursor:pointer;letter-spacing:0.6px;text-transform:uppercase;transition:all 0.15s}
.tab-btn.active{color:var(--navy);border-bottom-color:var(--navy)}
.tab-body{padding:14px;display:none}
.tab-body.active{display:block}
.sign-list{list-style:none}
.sign-list li{padding:7px 0;border-bottom:1px solid var(--border);font-size:14px;display:flex;gap:8px;line-height:1.4}
.sign-list li:last-child{border-bottom:none}
.sign-list li::before{content:'•';color:var(--muted);flex-shrink:0;margin-top:1px}
.section-label{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.8px;margin:14px 0 8px;padding-top:10px;border-top:1px solid var(--border)}
.med-card{margin-bottom:10px;border-radius:8px;border:1px solid var(--border);overflow:hidden}
.med-card:last-child{margin-bottom:0}
.med-drug{padding:9px 12px;background:var(--navy);color:#fff;font-size:13px;font-weight:800;letter-spacing:0.3px}
.med-row{display:flex;gap:8px;padding:6px 12px;border-bottom:1px solid var(--border);font-size:13px;line-height:1.4}
.med-row:last-of-type{border-bottom:none}
.med-label{color:var(--muted);font-weight:600;min-width:56px;flex-shrink:0;font-size:12px;padding-top:1px}
.med-val{font-family:var(--mono);color:var(--text);font-size:12px}
.med-note{padding:7px 12px;background:#f8fafc;font-size:11px;color:var(--muted);border-top:1px dashed var(--border);line-height:1.5}
.step-list{list-style:none;counter-reset:steps}
.step-list li{counter-increment:steps;display:flex;gap:10px;padding:7px 0;border-bottom:1px solid var(--border);font-size:14px;align-items:flex-start;line-height:1.4}
.step-list li:last-child{border-bottom:none}
.step-num{background:var(--navy);color:#fff;border-radius:50%;width:20px;height:20px;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px}
.flag-list{list-style:none}
.flag-list li{display:flex;gap:8px;padding:8px 0;border-bottom:1px solid var(--border);font-size:14px;align-items:flex-start;color:#7f1d1d;line-height:1.4}
.flag-list li:last-child{border-bottom:none}
.flag-icon{background:var(--red);color:#fff;border-radius:50%;width:18px;height:18px;font-size:10px;font-weight:900;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px}
.no-results{text-align:center;padding:40px 20px;color:var(--muted);font-size:14px;line-height:1.6}
</style>
</head>
<body>
<div class="hdr">
  <div class="hdr-top">
    <div style="flex:1">
      <div class="hdr-title">Protocol Quick Reference</div>
      <div class="hdr-sub">Clark County EMS &middot; 2026</div>
    </div>
    <span class="count-badge" id="count-badge">— protocols</span>
  </div>
  <div class="search-wrap">
    <input type="search" id="search" placeholder="Search condition, drug, dose..." autocomplete="off" spellcheck="false">
    <button class="search-clear" id="search-clear" aria-label="Clear search">×</button>
  </div>
  <div class="cats" id="cats">
    <button class="cat-btn active" data-cat="all">All</button>
    <button class="cat-btn" data-cat="cardiac">Cardiac</button>
    <button class="cat-btn" data-cat="respiratory">Respiratory</button>
    <button class="cat-btn" data-cat="airway">Airway</button>
    <button class="cat-btn" data-cat="neuro">Neuro</button>
    <button class="cat-btn" data-cat="toxicology">Toxicology</button>
    <button class="cat-btn" data-cat="other">Other</button>
  </div>
</div>
<div class="content" id="content"></div>
<script>
const P = [
  {id:'anaphylaxis',name:'Allergic Reaction / Anaphylaxis',cat:'respiratory',
   signs:['Mild: generalized itching and hives ONLY','Severe: dyspnea, wheezing, angioedema','Distributive shock: hypotension, tachycardia','Urticaria, flushing, erythema','GI: nausea, vomiting (less common)'],
   assess:['SpO2 and EtCO2 continuously','BP q2-3 min — MAP target > 65 mmHg','Skin: hives, angioedema distribution','Lung sounds: stridor vs. wheezing','Identify and document trigger/allergen'],
   meds:[
     {drug:'Epinephrine 1 mg/mL',dose:'0.3 mg IM',route:'IM (lateral thigh)',when:'Severe reaction — give FIRST, do not delay',notes:'Repeat in 10 min if IV drip unavailable and still severe. Alt: Epi autoinjector per manufacturer. Peds: 0.01 mg/kg IM max 0.3 mg.'},
     {drug:'Epinephrine Infusion',dose:'Start 2 mcg/min IV drip',route:'IV drip',when:'After IM epi, ongoing severe symptoms',notes:'Increase 2 mcg q 2 min PRN. Max 40 mcg/min. Peds: Start 0.1 mcg/kg/min, increase 0.05 mcg/kg/min q 2 min. Max 0.2 mcg/kg/min.'},
     {drug:'Diphenhydramine',dose:'1 mg/kg IV/IM/PO — max 50 mg',route:'IV / IM / PO',when:'All severe reactions',notes:'Peds mild: max 25 mg. Peds severe: same dose max 50 mg.'},
     {drug:'Albuterol',dose:'5 mg Nebulizer',route:'Nebulizer',when:'Wheezing present',notes:'Alt: DuoNeb 3 mL / Levalbuterol 2.5 mg. Peds < 15 kg: 2.5-5 mg. > 15 kg: 5-10 mg.'},
     {drug:'Methylprednisolone',dose:'125 mg IV',route:'IV',when:'All severe reactions',notes:'Alt: Dexamethasone 10 mg IV/IM/PO. Peds: 2 mg/kg IV max 125 mg.'},
     {drug:'NS Fluid Challenge',dose:'20 mL/kg rapid IV',route:'IV/IO',when:'Hypotension — maintain MAP > 65',notes:'Peds: 20 mL/kg IV/IO to maintain capillary refill < 2 sec.'},
     {drug:'Norepinephrine',dose:'Start 4 mcg/min — max 12 mcg/min',route:'IV drip',when:'Refractory shock not responding to epi + fluids',notes:'Peds: 0.1 mcg/kg/min, max 0.4 mcg/kg/min.'}
   ],
   steps:['High-flow O2 — do NOT delay epinephrine for IV access','Epinephrine 0.3 mg IM lateral thigh immediately for severe reaction','Position: supine + legs elevated if hypotension (unless respiratory distress)','Large bore IV x2 — aggressive fluid bolus','Cardiac monitor continuously','Start epinephrine infusion after IM dose for ongoing severe sx','CPAP/BiPAP if severe bronchospasm not responding','Early intubation if angioedema threatening airway'],
   flags:['Airway angioedema: intubate EARLY — delay = cric','Biphasic anaphylaxis occurs 8-72 hrs later — all patients need ED eval','PEA arrest in anaphylaxis: massive fluids + epinephrine 1 mg IV q 3-5 min','No IV access: IM epi lateral thigh now — never delay','SBP not responding to epi + fluids → norepinephrine drip immediately']},

  {id:'asthma',name:'Asthma (Severe / Status Asthmaticus)',cat:'respiratory',
   signs:['Diffuse wheezing — silent chest in extremis = alarm','Dyspnea, accessory muscle use, tripod positioning','SpO2 < 94%, tachycardia, tachypnea','ETCO2 elevated (air trapping)','Unable to speak in full sentences'],
   assess:['SpO2 and EtCO2 — rising ETCO2 in tachypneic pt = tiring = alarm','Lung sounds: entry, wheeze, silent chest','Work of breathing: accessory muscles, nasal flaring, retractions','Peak flow if available','HR: distinguish disease tachycardia from albuterol response'],
   meds:[
     {drug:'Albuterol + Atrovent',dose:'Albuterol 5 mg + Atrovent 0.5 mg Neb',route:'Nebulizer',when:'All symptomatic asthma — first line, repeat albuterol only PRN',notes:'Alt: DuoNeb 3 mL or Levalbuterol 1.25-2.5 mg + Atrovent 0.5 mg. Peds < 15 kg: Albuterol 2.5-5 mg; > 15 kg: 5-10 mg.'},
     {drug:'Methylprednisolone',dose:'125 mg IV',route:'IV',when:'All moderate-severe',notes:'Alt: Dexamethasone 10 mg IV/IM/PO. Peds: 2 mg/kg IV max 125 mg.'},
     {drug:'Magnesium Sulfate',dose:'2 g in 50-100 mL over 20 min IV',route:'IV',when:'Status asthmaticus not responding to above',notes:'Peds: 50 mg/kg max 2 g.'},
     {drug:'Epinephrine',dose:'0.3-0.5 mg IM OR 2-40 mcg/min IV infusion',route:'IM / IV drip',when:'Status asthmaticus: deteriorating, no IV or not responding',notes:'Lower dose 0.3 mg if > 40 yo or known CAD. Peds: 0.01 mg/kg IM max 0.5 mg; IV 0.1 mcg/kg/min for status.'},
     {drug:'CPAP/BiPAP',dose:'Per CPAP/BiPAP protocol',route:'Non-invasive',when:'Moderate-severe, not in extremis',notes:''}
   ],
   steps:['High-flow O2, titrate to SpO2 > 94%','Nebulized bronchodilators immediately — continuous if severe','Position of comfort — allow patient to self-position','IV access — Solumedrol IV','CPAP early if not in extremis','Magnesium for status asthmaticus','Epinephrine if still deteriorating','Aggressive DSI if silent chest or SpO2 falling despite above'],
   flags:['Silent chest = near-complete obstruction = imminent arrest — act now','Rising ETCO2 in a tachypneic patient = tiring → respiratory failure','Intubating asthmatics is high-risk: auto-PEEP, hypotension risk — low RR 8-10/min','RSI/DSI if must intubate — have plan for post-intubation hypotension']},

  {id:'copd',name:'COPD Exacerbation',cat:'respiratory',
   signs:['Dyspnea, productive cough, barrel chest','Wheezing or severely diminished sounds','Accessory muscle use, pursed-lip breathing','Elevated baseline ETCO2 (normal for this pt)','Cyanosis, confusion (severe CO2 retention)'],
   assess:['SpO2 — target 88-92%, NOT 100% for known COPD','EtCO2 — elevated baseline is normal; rising trend matters','Lung sounds: wheezing, rhonchi, diminished','Mental status: CO2 narcosis causes AMS','Differentiate from CHF (crackles, JVD, pedal edema vs. wheeze)'],
   meds:[
     {drug:'Albuterol + Atrovent',dose:'Albuterol 5 mg + Atrovent 0.5 mg Neb',route:'Nebulizer',when:'Bronchospasm — first line',notes:'Alt: DuoNeb 3 mL or Levalbuterol 1.25-2.5 mg + Atrovent 0.5 mg. Repeat albuterol only PRN.'},
     {drug:'Methylprednisolone',dose:'125 mg IV',route:'IV',when:'Moderate-severe exacerbation',notes:'Alt: Dexamethasone 10 mg IV/IM/PO.'},
     {drug:'CPAP/BiPAP',dose:'Per protocol — use PEEP valve if ventilating',route:'Non-invasive',when:'Moderate-severe distress — early use reduces intubation',notes:''}
   ],
   steps:['Controlled O2: titrate to SpO2 88-92% — do NOT hyperoxigenate COPD','CPAP/BiPAP early — first-line before intubation','Nebulized bronchodilators — continuous if severe','Position: sitting up, allow patient to self-position','IV access — steroids','If cyanotic or severe: high-flow O2 temporarily then titrate down','Prepare for DSI if not responding to above'],
   flags:['Hyperoxia worsens hypercapnic drive — target 88-92% NOT 100%','ETCO2 elevated baseline is normal — rising trend is the alarm','CPAP/BiPAP is first-line before intubation — use early, not as last resort','AMS + COPD = CO2 narcosis until proven otherwise']},

  {id:'chf',name:'CHF / Pulmonary Edema',cat:'respiratory',
   signs:["Dyspnea, orthopnea (can't lie flat)",'Bilateral crackles/rales','JVD, pedal edema','Pink frothy sputum (severe)','SpO2 low, tachycardia, hypertension (or shock if cardiogenic)'],
   assess:['SpO2 and EtCO2','Lung sounds: bilateral crackles','JVD and pedal edema presence','BP: hypertensive CHF vs. cardiogenic shock (SBP < 90)','12-lead: rule out STEMI as trigger'],
   meds:[
     {drug:'CPAP/BiPAP',dose:'100% FiO2, PEEP 5-10 cmH2O',route:'Non-invasive',when:'Moderate-severe distress — FIRST LINE',notes:'Use PEEP valve if assisting ventilation. Most effective intervention for CHF.'},
     {drug:'Nitroglycerin',dose:'0.4 mg SL q 3-5 min PRN',route:'SL',when:'SBP > 110 mmHg',notes:"CONTRAINDICATED: PDE-5 inhibitors (Viagra, Cialis, Levitra, Stendra) in past 48 hrs. Caution: right-sided MI (V3R/V4R changes). Obtain IV access before giving."},
     {drug:'Fentanyl',dose:'1 mcg/kg IV, max 100 mcg/dose',route:'IV',when:'Chest pain with suspected ACS component',notes:'q 5-10 min to 300 mcg total PRN.'}
   ],
   steps:['Sit patient up — dangle legs if possible','High-flow O2, target SpO2 94-98%','CPAP immediately for moderate-severe distress','12-lead ECG — rule out STEMI','If SBP > 110: Nitroglycerin SL','IV access — obtain large bore','If SBP < 90: cardiogenic shock protocol — NO nitroglycerin','Do NOT give fluids — this patient is drowning, not dry'],
   flags:['STEMI can trigger CHF — 12-lead on every CHF patient','Do NOT give fluids unless confirmed dry CHF with cardiomyopathy','SBP < 90 = cardiogenic shock → vasopressors, not fluids','CPAP is the primary intervention — start early, not as rescue']},

  {id:'vfib',name:'Cardiac Arrest — VFib / pVT',cat:'cardiac',
   signs:['Pulseless, apneic','VFib or pulseless VTach on monitor','No organized rhythm producing a pulse'],
   assess:['Confirm pulselessness — 10 sec max','Rhythm on monitor: coarse VF vs. fine VF vs. pVT','CPR quality: rate 100-120, depth 2-2.4 in, full recoil','EtCO2: goal > 10 — if < 10 improve CPR','Identify H\'s and T\'s continuously'],
   meds:[
     {drug:'Amiodarone',dose:'300 mg IV/IO concurrent with CPR',route:'IV/IO',when:'After 2nd (or 3rd) shock',notes:'Second dose: 150 mg IV/IO. NOT in Torsades. Peds: 5 mg/kg IV/IO max 300 mg; 2nd dose 2.5 mg/kg.'},
     {drug:'Epinephrine',dose:'1 mg/10 mL IV/IO',route:'IV/IO',when:'After first Amiodarone dose; repeat q 3-5 min',notes:'Peds: 0.01 mg/kg IV/IO q 3-5 min max adult dose.'},
     {drug:'Lidocaine',dose:'1.5 mg/kg IV/IO',route:'IV/IO',when:'If Amiodarone contraindicated',notes:'May repeat once. Peds: 1 mg/kg, may repeat once.'},
     {drug:'Magnesium Sulfate',dose:'2 g bolus IV/IO in 50 mL NS wide open',route:'IV/IO',when:'Torsades (multifocal WCT) or suspected Mg deficiency',notes:'Peds: 50 mg/kg max 2 g.'},
     {drug:'Sodium Bicarbonate',dose:'1 mEq/kg IV/IO',route:'IV/IO',when:'Known TCA OD, Benadryl OD — NOT routine',notes:'Peds: 1 mEq/kg max 50 mEq.'}
   ],
   steps:['CPR immediately — minimize all interruptions','Defibrillate as soon as monitor applied','Cycle: CPR 2 min → rhythm check → defibrillate PRN','iGel for airway — do NOT stop CPR to intubate','IV/IO above diaphragm — humeral IO preferred','Amiodarone 300 mg concurrent with CPR after 2nd shock','Epinephrine 1 mg after first amiodarone dose','After 3rd unsuccessful shock: change defib vector A/P → A/L','LUCAS after first 2-min manual cycle — minimize interruption','After 5th shock: contact OLMC','ROSC: follow ROSC protocol'],
   flags:['Torsades: Magnesium NOT Amiodarone','Persistent VF/pVT after 5 shocks: OLMC mandatory','Airway must cause ZERO CPR interruptions — iGel only','Hypothermic arrest: max 3 shocks until rewarmed']},

  {id:'asystole',name:'Cardiac Arrest — Asystole',cat:'cardiac',
   signs:['Pulseless, apneic','Flat line on monitor — confirm in 2 leads','No organized rhythm'],
   assess:['Confirm in 2 leads — check lead connections before calling asystole','CPR quality continuously','EtCO2: goal > 10 — low EtCO2 = poor CPR quality or non-survivable arrest','H\'s and T\'s: hypoxia, hypovolemia, hypothermia, tamponade, tension pneumo, toxins, PE'],
   meds:[
     {drug:'Epinephrine',dose:'1 mg/10 mL IV/IO — as soon as possible',route:'IV/IO',when:'Immediately upon cardiac arrest recognition',notes:'Repeat every 4 minutes. Peds: 0.01 mg/kg IV/IO q 4 min, max adult dose.'},
     {drug:'Sodium Bicarbonate',dose:'1 mEq/kg IV/IO',route:'IV/IO',when:'Suspected acidosis, TCA OD, Benadryl OD',notes:'Peds: 1 mEq/kg max 50 mEq.'},
     {drug:'Calcium Gluconate',dose:'3 g IV/IO once',route:'IV/IO',when:'Suspected CCB or beta-blocker OD',notes:''}
   ],
   steps:['High quality CPR — rate 100-120, depth 2-2.4 in, full recoil','Epinephrine 1 mg IV/IO as soon as access established','iGel airway — ventilate 8-10/min','Continue 2-min CPR cycles with rhythm check','IV/IO above diaphragm preferred','Treat all reversible H\'s and T\'s','Consider Death in Field criteria if not responding'],
   flags:['Verify asystole in 2 leads — check lead connections before calling it','ETCO2 < 10 with good CPR = very poor prognosis','Early epinephrine is the primary drug-driven intervention for asystole']},

  {id:'pea',name:'Cardiac Arrest — PEA',cat:'cardiac',
   signs:['Pulseless, apneic','Organized (or near-organized) rhythm on monitor — NO pulse','Narrow complex PEA = mechanical cause (PE, tamponade, hypovolemia)','Wide complex PEA = metabolic/toxic cause'],
   assess:['Confirm pulselessness — rhythm looks organized but no pulse','Narrow vs. wide complex QRS guides differential','Aggressively search H\'s and T\'s — hypovolemia, tension pneumo, tamponade, PE most common','POCUS if available: cardiac, IVC, lung'],
   meds:[
     {drug:'Epinephrine',dose:'1 mg/10 mL IV/IO — immediately',route:'IV/IO',when:'Immediately upon arrest recognition',notes:'Repeat every 3-5 min. Peds: 0.01 mg/kg IV/IO q 3-5 min.'},
     {drug:'NS Bolus',dose:'2 L rapid infusion',route:'IV/IO',when:'All PEA — assume hypovolemia first',notes:'Peds: 20 mL/kg bolus, repeat x3 PRN max 60 mL/kg.'},
     {drug:'Sodium Bicarbonate',dose:'1 mEq/kg IV/IO',route:'IV/IO',when:'Wide complex PEA, suspected acidosis or TCA OD',notes:'May repeat after 5 min if QRS narrowing.'},
     {drug:'Calcium Gluconate',dose:'3 g IV/IO once',route:'IV/IO',when:'Wide complex PEA, suspected CCB or beta-blocker OD',notes:''}
   ],
   steps:['High quality CPR immediately','Epinephrine 1 mg IV/IO ASAP','Aggressive IV fluids 2 L — assume hypovolemia','Narrow complex: search for mechanical cause (PE, tamponade, hypovolemia)','Wide complex: search for metabolic/toxic cause — give bicarb + calcium','Needle decompression for tension pneumo if suspected','Rapid transport for PE or tamponade','iGel airway — do not interrupt CPR'],
   flags:['Narrow complex PEA = PE, tamponade, hypovolemia — aggressive treatment','Wide complex PEA = toxins, hyperkalemia, acidosis — bicarb and calcium gluconate','Tension pneumo: needle decompression in the field — do not wait','Tamponade and massive PE: rapid transport is the treatment']},

  {id:'rosc',name:'Post-Cardiac Arrest Care — ROSC',cat:'cardiac',
   signs:['Pulse returns after arrest','EtCO2 spike is diagnostic of ROSC','Patient may remain unresponsive after ROSC'],
   assess:['Continuous SpO2, EtCO2 — target 94-98% O2, ETCO2 35-45','BP continuously — goal SBP > 100, MAP > 65','12-lead ECG immediately — identify STEMI','Neurological status/GCS','Temperature — manage fever or hypothermia'],
   meds:[
     {drug:'O2 Titration',dose:'Titrate to SpO2 94-98%',route:'BVM/ETT',when:'Immediately post-ROSC',notes:'Do NOT hyperventilate. Target RR 10-12/min, ETCO2 35-45. Hyperoxia worsens neurological outcomes.'},
     {drug:'NS/LR Fluid',dose:'PRN to maintain MAP > 65',route:'IV/IO',when:'Hypotension: SBP < 100 or MAP < 65',notes:'Follow Shock protocol for persistent hypotension.'},
     {drug:'Norepinephrine',dose:'Start 4 mcg/min — max 12 mcg/min',route:'IV drip',when:'Hypotension not responding to fluids',notes:'Goal MAP > 65.'}
   ],
   steps:['Titrate O2 to SpO2 94-98% — avoid hyperoxia','Ventilate 10-12/min — avoid hyperventilation (target ETCO2 35-45)','12-lead ECG immediately — STEMI = cath lab activation via Pulsara','Treat hypotension per Shock protocol','Transport to PCI-capable facility for STEMI or unknown','Observe 5-10 min during packaging for re-arrest','Notify receiving of LUCAS use if applicable','Continuous monitoring — reassess every 2-3 min'],
   flags:['Re-arrest can occur at any time — never stop monitoring','STEMI post-ROSC = cath lab activation — every minute matters','Hyperoxia post-ROSC is actively harmful — titrate down','Maintain MAP > 65 — hypotension causes secondary anoxic injury']},

  {id:'brady',name:'Bradycardia (Symptomatic)',cat:'cardiac',
   signs:['HR < 60 bpm WITH signs of poor perfusion','Hypotension, AMS, ischemic chest pain, acute HF','Syncope or presyncope','Diaphoresis'],
   assess:['12-lead ECG — identify degree of block (2nd/3rd degree)','BP — SBP and MAP','Signs of poor perfusion: AMS, hypotension, chest pain, HF','Possible cause: inferior MI, medication (beta-blockers, CCB, digoxin), vagal'],
   meds:[
     {drug:'Atropine',dose:'1 mg IV/IO — repeat q 2-5 min — max 3 mg total',route:'IV/IO',when:'Symptomatic bradycardia — first pharmacological line',notes:'Stop if chest pain increases. Max dose 3 mg. Peds: Epinephrine preferred (see below).'},
     {drug:'Epinephrine Infusion',dose:'Start 2 mcg/min IV — max 40 mcg/min',route:'IV drip',when:'No response to Atropine',notes:'Titrate to clinical response. Peds: 0.01 mg/kg q 3-5 min then infusion 0.1 mcg/kg/min up to 1 mcg/kg/min.'},
     {drug:'Transcutaneous Pacing (TCP)',dose:'Per device — target capture',route:'Transcutaneous',when:'High-degree heart block OR Atropine failure',notes:'Primary treatment for high degree block. Sedate before or during: Midazolam 2.5 mg IV or 5 mg IM.'},
     {drug:'Midazolam',dose:'2.5 mg IV or 5 mg IM — max 10 mg PRN',route:'IV/IM',when:'Sedation for transcutaneous pacing',notes:''},

     {drug:'Activated Charcoal',dose:'50 g PO',route:'PO',when:'Aspirin or Acetaminophen OD — ONLY if recommended by Poison Center or Medical Control',notes:'Peds: 1 g/kg max 50 g per MC or Poison Center concurrence.'},
     {drug:'Calcium Gluconate (CCB/Beta-Blocker)',dose:'3 g IV/IO over 15 min',route:'IV/IO',when:'Calcium Channel Blocker or Beta-Blocker overdose',notes:'Treat bradycardia and/or shock per protocol. Peds: 60 mg/kg max 3 g.'},
     {drug:'Atropine (Organophosphate/Nerve Agent)',dose:'2 mg IV bolus → 4 mg IV → double q 3-5 min until improved',route:'IV / IM',when:'Organophosphate or nerve agent poisoning',notes:'Titrate to improved respiratory function and decreased secretions. Peds: 0.02 mg/kg max 2 mg.'},
     {drug:'Sodium Thiosulfate (Cyanide)',dose:'50 mL of 25% solution IV/IO over 10-30 min',route:'IV/IO',when:'Suspected cyanide: closed-space fire with plastics/wool + AMS, arrest, or refractory hypotension',notes:'Peds: 1.6 mL/kg IV/IO over 10 min. Reduce infusion if hypotensive from medication.'},
     {drug:'Sodium Bicarbonate (TCA/Benadryl OD)',dose:'1 mEq/kg slow IV push — repeat q 5 min if improving QRS',route:'IV',when:'TCA or Benadryl OD with hypotension or QRS > 0.12',notes:'Treatment goal: QRS < 0.12. Refractory arrhythmias: Magnesium 2 g IV over 15 min. Peds: 1 mEq/kg max 50 mEq.'},
     {drug:'Midazolam (Hyperadrenergic)',dose:'2.5-5 mg IV/IM q 5 min PRN',route:'IV/IM',when:'Cocaine, meth, MDMA-induced hyperadrenergic arrhythmias or agitation',notes:'Peds: 0.2 mg/kg IV/IO/IM/IN max 10 mg.'},
     {drug:'Diphenhydramine (Dystonic Reaction)',dose:'1 mg/kg IV/IM — max 50 mg',route:'IV/IM',when:'Phenothiazine-induced dystonic reaction or akathisia',notes:'Complete relief typically in 1-2 min IV. Peds max 25 mg.'}
   ],
   steps:['Scene safety first — protect rescuers from contamination','Contact OLMC as needed; Washington Poison Center (800) 709-0911 for stable patients','Identify substance/toxidrome if possible','Manage airway per Airway Management protocol','Treat shock per Shock protocol','Specific antidotes per toxidrome (see meds)','Continuous cardiac monitoring and ECG','Document all substances found, doses, and timeline'],
   flags:['TCA and Benadryl OD: QRS > 0.12 = sodium bicarb immediately','Organophosphate: Atropine is the antidote — titrate to secretion drying, not HR','Cyanide: in closed-space fire with AMS or arrest — treat empirically','Carbon monoxide: multiple victims + sick pets at same location = CO until proven otherwise','Document OLMC contact and Poison Center recommendations in narrative']}
];

let activeCat='all', activeSearch='', expandedId=null, activeTabs={};

function filtered(){
  let list=P;
  if(activeCat!=='all') list=list.filter(p=>p.cat===activeCat);
  if(activeSearch){
    const q=activeSearch.toLowerCase();
    list=list.filter(p=>{
      return [p.name,...p.signs,...p.assess,...p.meds.map(m=>m.drug+' '+m.dose+' '+m.when+' '+m.notes),...p.steps,...p.flags].join(' ').toLowerCase().includes(q);
    });
  }
  return list;
}

const CAT={cardiac:'CARDIAC',respiratory:'RESPIRATORY',airway:'AIRWAY',neuro:'NEURO',toxicology:'TOXICOLOGY',other:'OTHER'};

function medCards(meds){
  return meds.map(m=>`<div class="med-card"><div class="med-drug">${m.drug}</div><div class="med-row"><div class="med-label">Dose</div><div class="med-val">${m.dose}</div></div><div class="med-row"><div class="med-label">Route</div><div class="med-val">${m.route}</div></div><div class="med-row"><div class="med-label">When</div><div class="med-val">${m.when}</div></div>${m.notes?`<div class="med-note">${m.notes}</div>`:''}</div>`).join('');
}

function signList(items){
  return '<ul class="sign-list">'+items.map(i=>`<li>${i}</li>`).join('')+'</ul>';
}

function stepList(items){
  return '<ol class="step-list">'+items.map(i=>`<li><div class="step-num"></div><div>${i}</div></li>`).join('')+'</ol>';
}

function flagList(items){
  return '<ul class="flag-list">'+items.map(i=>`<li><div class="flag-icon">!</div><div>${i}</div></li>`).join('')+'</ul>';
}

function render(){
  const list=filtered();
  document.getElementById('count-badge').textContent=list.length+' protocol'+(list.length!==1?'s':'');
  const el=document.getElementById('content');
  if(!list.length){el.innerHTML='<div class="no-results">No protocols match your search.<br><span style="font-size:12px;margin-top:6px;display:block">Try a drug name, condition, dose, or route.</span></div>';return;}
  const tab=p=>activeTabs[p.id]||'signs';
  el.innerHTML=list.map(p=>{
    const exp=expandedId===p.id;
    let inner='';
    if(exp){
      const t=tab(p);
      const tabs=[{id:'signs',label:'Signs / Sx'},{id:'meds',label:'Meds'},{id:'steps',label:'Actions'},{id:'flags',label:'Red Flags'}];
      inner=`<div class="card-tabs">${tabs.map(tb=>`<button class="tab-btn${t===tb.id?' active':''}" data-pid="${p.id}" data-tab="${tb.id}">${tb.label}</button>`).join('')}</div>`
        +`<div class="tab-body${t==='signs'?' active':''}"><div class="section-label" style="margin-top:0;border-top:none">Signs &amp; Symptoms</div>${signList(p.signs)}<div class="section-label">Priority Assessment</div>${signList(p.assess)}</div>`
        +`<div class="tab-body${t==='meds'?' active':''}">${medCards(p.meds)}</div>`
        +`<div class="tab-body${t==='steps'?' active':''}">${stepList(p.steps)}</div>`
        +`<div class="tab-body${t==='flags'?' active':''}">${flagList(p.flags)}</div>`;
    }
    return `<div class="protocol-card${exp?' expanded':''}" data-id="${p.id}"><div class="card-head" data-toggle="${p.id}"><div style="flex:1;min-width:0"><div class="card-name">${p.name}</div><div class="card-cat">${CAT[p.cat]||p.cat}</div></div><div class="card-chevron">⌄</div></div>${inner}</div>`;
  }).join('');

  // Re-number step counters via CSS (counter-reset handled by CSS)
  document.querySelectorAll('.step-list li').forEach((li,i)=>{
    li.querySelector('.step-num').textContent=(i%li.parentElement.children.length)+1;
  });
  // Actually recalculate per-list
  document.querySelectorAll('.step-list').forEach(ol=>{
    Array.from(ol.querySelectorAll('li')).forEach((li,i)=>{
      li.querySelector('.step-num').textContent=i+1;
    });
  });
}

document.getElementById('content').addEventListener('click',e=>{
  const tog=e.target.closest('[data-toggle]');
  if(tog){
    const id=tog.getAttribute('data-toggle');
    expandedId=expandedId===id?null:id;
    render();
    if(expandedId){setTimeout(()=>{const c=document.querySelector(`[data-id="${id}"]`);if(c)c.scrollIntoView({behavior:'smooth',block:'start'});},60);}
    return;
  }
  const tb=e.target.closest('.tab-btn');
  if(tb){activeTabs[tb.getAttribute('data-pid')]=tb.getAttribute('data-tab');render();}
});

const srch=document.getElementById('search');
const clr=document.getElementById('search-clear');
srch.addEventListener('input',()=>{activeSearch=srch.value.trim();clr.style.display=activeSearch?'block':'none';expandedId=null;render();});
clr.addEventListener('click',()=>{srch.value='';activeSearch='';clr.style.display='none';expandedId=null;render();});
document.getElementById('cats').addEventListener('click',e=>{
  const btn=e.target.closest('.cat-btn');
  if(!btn)return;
  activeCat=btn.getAttribute('data-cat');
  document.querySelectorAll('.cat-btn').forEach(b=>b.classList.toggle('active',b===btn));
  expandedId=null;render();
});

render();
</script>
</body>
</html>
